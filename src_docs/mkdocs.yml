# this_file: src_docs/mkdocs.yml
site_name: Fontport for FontLab
site_description: Fontport for FontLab public contracts and complete maintained guides.
site_url: https://fontlabcom.github.io/fontlab-fontport/
repo_url: https://github.com/fontlabcom/fontlab-fontport
repo_name: fontlabcom/fontlab-fontport
docs_dir: md
site_dir: ../docs
use_directory_urls: true
theme:
  name: materialx
  language: en
  custom_dir: overrides
  palette:
    scheme: default
  features:
    - search.highlight
    - content.code.copy
plugins:
  - search:
      lang: [en]
markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
nav:
  - Index: index.md
  - Installation: installation.md
  - Fonts Pens And Interchange: fonts-pens-and-interchange.md
  - Development And Limits: development-and-limits.md
  - Licence: licence.md
  - Complete maintained guides:
      - FONTPARTS-COVERAGE: guides/FONTPARTS-COVERAGE.md
      - INTEGRATION: guides/INTEGRATION.md
      - LIVE-PEN-RECIPES: guides/LIVE-PEN-RECIPES.md
      - NATIVE-BOUNDARIES: guides/NATIVE-BOUNDARIES.md
      - NATIVE-FEATURES: guides/NATIVE-FEATURES.md
      - ROUND10-NATIVE: guides/ROUND10-NATIVE.md
      - ROUND12-NATIVE: guides/ROUND12-NATIVE.md
      - ROUND13-NATIVE: guides/ROUND13-NATIVE.md
      - ROUND14-NATIVE: guides/ROUND14-NATIVE.md
      - ROUND15-NATIVE: guides/ROUND15-NATIVE.md
      - UFO-INTERCHANGE: guides/UFO-INTERCHANGE.md
extra_css:
  - stylesheets/local.css
  - https://i.fontlab.com/fltheme26/1.0.0/components.css
  - https://i.fontlab.com/fltheme26/1.0.0/theme.css
extra_javascript:
  - https://i.fontlab.com/fltheme26/1.0.0/basecoat.js
  - https://i.fontlab.com/fltheme26/1.0.0/theme.js
hooks:
  - english_search.py
